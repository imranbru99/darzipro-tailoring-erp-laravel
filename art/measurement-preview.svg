<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1100" height="520" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Header -->
  <g transform="translate(40, 30)">
    <rect width="1020" height="56" rx="12" fill="#064e3b"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">
      📐 ডিজিটাল বডি পরিমাপ ভল্ট (Body Measurement Vault &amp; Karigar Token)
    </text>
    <text x="820" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">
      গ্রাহক: তানভীর আহমেদ
    </text>
  </g>

  <!-- Left: Panjabi Measurement Grid -->
  <g transform="translate(40, 105)" filter="url(#mShadow)">
    <rect width="660" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">
      পাঞ্জাবি পরিমাপ বিবরণ (Panjabi Measurements in Inches &amp; Soot)
    </text>
    <rect x="520" y="16" width="116" height="24" rx="12" fill="#ecfdf5"/>
    <text x="578" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">সেভ করা মাপ ✓</text>

    <!-- 8 Measurement Box Grid -->
    <g transform="translate(24, 60)">
      <!-- Length -->
      <rect width="140" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">ঝুল (Length)</text>
      <text x="14" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">৪১.৫ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

      <!-- Chest -->
      <rect x="155" width="140" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="169" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">বডি / বুক (Chest)</text>
      <text x="169" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">৪০.০ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

      <!-- Waist -->
      <rect x="310" width="140" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="324" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">পেট (Waist)</text>
      <text x="324" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">৩৮.০ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

      <!-- Hip -->
      <rect x="465" width="145" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="479" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">কোমর / হিপ (Hip)</text>
      <text x="479" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">৪২.০ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

      <!-- Shoulder -->
      <g transform="translate(0, 80)">
        <rect width="140" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">পুট / তিরা (Shoulder)</text>
        <text x="14" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">১৮.০ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

        <!-- Sleeve -->
        <rect x="155" width="140" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="169" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">হাতা (Sleeve)</text>
        <text x="169" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">২৫.০ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

        <!-- Cuff -->
        <rect x="310" width="140" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="324" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">মুহুরি (Cuff)</text>
        <text x="324" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">১১.০ <tspan font-size="12" fill="#64748b">ইঞ্চি</tspan></text>

        <!-- Collar -->
        <rect x="465" width="145" height="65" rx="8" fill="#ecfdf5" stroke="#10b981"/>
        <text x="479" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">কলার সাইজ (Collar)</text>
        <text x="479" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#047857">১৬.০ <tspan font-size="12" fill="#059669">ইঞ্চি</tspan></text>
      </g>
    </g>

    <!-- Custom Styling specifications -->
    <g transform="translate(24, 240)">
      <text x="4" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">ডিজাইন ও কাটিং স্পেসিফিকেশন:</text>
      <rect x="0" y="26" width="190" height="32" rx="6" fill="#f1f5f9"/>
      <text x="12" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">কলার: ব্যান কলার (Mandarin)</text>

      <rect x="200" y="26" width="190" height="32" rx="6" fill="#f1f5f9"/>
      <text x="212" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">পট্টি: লুকানো বোতাম পট্টি</text>

      <rect x="400" y="26" width="210" height="32" rx="6" fill="#f1f5f9"/>
      <text x="412" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">পকেট: ২ পাশে গভীর সাইড পকেট</text>
    </g>

    <!-- Yardage Calculation result -->
    <g transform="translate(24, 320)">
      <rect width="610" height="38" rx="6" fill="#fef3c7" stroke="#fde047"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">
        🤖 এআই স্বয়ংক্রিয় গজ হিসাব: উচ্চতা ও বডি সাইজ অনুযায়ী প্রয়োজন = ২.৫০ গজ কাপড় (Fabric)
      </text>
    </g>
  </g>

  <!-- Right: Karigar Assignment Card -->
  <g transform="translate(720, 105)" filter="url(#mShadow)">
    <rect width="340" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">
      কারিগর জব ও মজুরি স্লিপ
    </text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">কাটিং ও সেলাই বণ্টন</text>

    <!-- Cutting Task -->
    <g transform="translate(20, 70)">
      <rect width="300" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">১. কাটিং মাস্টার (Master Cutter)</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">ওস্তাদ মোশাররফ • মজুরি: ৳৬০</text>
      <rect x="200" y="30" width="85" height="24" rx="12" fill="#dcfce7"/>
      <text x="242" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">সম্পন্ন ✓</text>
    </g>

    <!-- Stitching Task -->
    <g transform="translate(20, 160)">
      <rect width="300" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">২. সেলাই কারিগর (Sewing Artisan)</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">আব্দুল করিম • মজুরি: ৳২০০</text>
      <rect x="200" y="30" width="85" height="24" rx="12" fill="#dcfce7"/>
      <text x="242" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">সম্পন্ন ✓</text>
    </g>

    <!-- Finishing Task -->
    <g transform="translate(20, 250)">
      <rect width="300" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">৩. আয়রন ও বোতাম ফিনিশিং</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">সুজন মিয়া • মজুরি: ৳৪০</text>
      <rect x="200" y="30" width="85" height="24" rx="12" fill="#fef9c3"/>
      <text x="242" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a16207">চলমান...</text>
    </g>

    <!-- Wage total footer -->
    <g transform="translate(20, 340)">
      <text x="4" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b">মোট কারিগর মজুরি ব্যয়:</text>
      <text x="295" y="20" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#059669">৳৩০০</text>
    </g>
  </g>
</svg>
