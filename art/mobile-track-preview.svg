<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="520" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Left: Explanatory Copy & Value Proposition -->
  <g transform="translate(60, 60)">
    <span font-family="system-ui, sans-serif">
      <rect width="180" height="28" rx="14" fill="#ecfdf5" stroke="#10b981"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">📱 কাস্টমার সেলফ-সার্ভিস</text>
    </span>

    <text y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#0f172a">
      মোবাইল অর্ডার ট্র্যাকিং
    </text>
    <text y="102" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#475569">
      গ্রাহকের বারবার দোকানে এসে খোঁজ নেওয়ার দিন শেষ!
    </text>

    <g transform="translate(0, 130)" font-family="system-ui, sans-serif" font-size="13" fill="#334155">
      <!-- Point 1 -->
      <circle cx="10" cy="10" r="10" fill="#059669"/>
      <text x="7" y="14" font-weight="900" fill="#ffffff" font-size="11">✓</text>
      <text x="30" y="15" font-weight="700">৯৮% কাস্টমার ফোন কল কমে যায়</text>
      <text x="30" y="32" font-size="11" fill="#64748b">গ্রাহক ঘরে বসেই পোশাক কোন ধাপে আছে তা সরাসরি দেখতে পান।</text>

      <!-- Point 2 -->
      <g transform="translate(0, 50)">
        <circle cx="10" cy="10" r="10" fill="#059669"/>
        <text x="7" y="14" font-weight="900" fill="#ffffff" font-size="11">✓</text>
        <text x="30" y="15" font-weight="700">কোনো পাসওয়ার্ড বা রেজিস্ট্রেশন প্রয়োজন নেই</text>
        <text x="30" y="32" font-size="11" fill="#64748b">শুধু মোবাইল নম্বর ও ৪ সংখ্যার টোকেন পিন দিলেই দেখতে পাবেন।</text>
      </g>

      <!-- Point 3 -->
      <g transform="translate(0, 100)">
        <circle cx="10" cy="10" r="10" fill="#059669"/>
        <text x="7" y="14" font-weight="900" fill="#ffffff" font-size="11">✓</text>
        <text x="30" y="15" font-weight="700">স্বয়ংক্রিয় বাংলা এসএমএস নোটিফিকেশন</text>
        <text x="30" y="32" font-size="11" fill="#64748b">অর্ডার প্রস্তুত হওয়া মাত্রই গ্রাহকের ফোনে মেসেজ চলে যাবে।</text>
      </g>

      <!-- Point 4 -->
      <g transform="translate(0, 150)">
        <circle cx="10" cy="10" r="10" fill="#059669"/>
        <text x="7" y="14" font-weight="900" fill="#ffffff" font-size="11">✓</text>
        <text x="30" y="15" font-weight="700">অনলাইন থেকে সরাসরি পিডিএফ রিসিট ডাউনলোড</text>
        <text x="30" y="32" font-size="11" fill="#64748b">রিসিট হারিয়ে গেলেও কোনো চিন্তা নেই।</text>
      </g>
    </g>
  </g>

  <!-- Right: Smartphone Mockup with Live Tracker UI -->
  <g transform="translate(680, 25)" filter="url(#phoneShadow)">
    <!-- Phone Bezel -->
    <rect width="360" height="470" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    
    <!-- Phone Screen -->
    <rect x="12" y="12" width="336" height="446" rx="26" fill="#ffffff"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="120" y="18" width="120" height="18" rx="9" fill="#0f172a"/>

    <!-- App Header inside Phone -->
    <g transform="translate(24, 50)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a">✂️ Darzi<tspan fill="#059669">Pro</tspan> ট্র্যাকার</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">অর্ডার নং: DHK-2026-0001</text>
      <rect x="220" y="5" width="85" height="22" rx="11" fill="#059669"/>
      <text x="262" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">প্রস্তুত ✓</text>
    </g>

    <!-- Progress Timeline inside phone -->
    <g transform="translate(24, 100)">
      <rect width="310" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">কাজের বর্তমান অগ্রগতি:</text>

      <!-- Steps -->
      <g transform="translate(14, 45)" font-family="system-ui, sans-serif" font-size="10">
        <!-- Step 1 -->
        <circle cx="8" cy="8" r="8" fill="#059669"/>
        <text x="6" y="12" font-size="9" font-weight="bold" fill="#fff">✓</text>
        <text x="24" y="12" font-weight="700" fill="#0f172a">অর্ডার ও মাপ গ্রহণ সম্পন্ন</text>
        <line x1="8" y1="16" x2="8" y2="30" stroke="#059669" stroke-width="2"/>

        <!-- Step 2 -->
        <g transform="translate(0, 24)">
          <circle cx="8" cy="8" r="8" fill="#059669"/>
          <text x="6" y="12" font-size="9" font-weight="bold" fill="#fff">✓</text>
          <text x="24" y="12" font-weight="700" fill="#0f172a">কাটিং মাস্টারের কাজ সম্পন্ন</text>
          <line x1="8" y1="16" x2="8" y2="30" stroke="#059669" stroke-width="2"/>
        </g>

        <!-- Step 3 -->
        <g transform="translate(0, 48)">
          <circle cx="8" cy="8" r="8" fill="#059669"/>
          <text x="6" y="12" font-size="9" font-weight="bold" fill="#fff">✓</text>
          <text x="24" y="12" font-weight="700" fill="#0f172a">সেলাই কারিগরের কাজ সম্পন্ন</text>
          <line x1="8" y1="16" x2="8" y2="30" stroke="#059669" stroke-width="2"/>
        </g>

        <!-- Step 4 Active -->
        <g transform="translate(0, 72)">
          <circle cx="8" cy="8" r="8" fill="#10b981"/>
          <circle cx="8" cy="8" r="4" fill="#ffffff"/>
          <text x="24" y="12" font-weight="800" fill="#059669">ডেলিভারির জন্য প্রস্তুত (দোকানে আসুন)</text>
        </g>
      </g>
    </g>

    <!-- Due Balance Card inside Phone -->
    <g transform="translate(24, 265)">
      <rect width="310" height="95" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#065f46">মোট বিল: ৳২,২৫০ | জমা: ৳১,৫০০</text>
      <text x="14" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">ডেলিভারির সময় বকেয়া পরিশোধ:</text>
      <text x="14" y="78" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#b91c1c">৳৭৫০</text>
      <text x="180" y="76" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#065f46">ডেলিভারি: ২৪/১০/২০২৬</text>
    </g>

    <!-- Button inside phone -->
    <g transform="translate(24, 375)">
      <rect width="310" height="38" rx="10" fill="#0f172a"/>
      <text x="155" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
        📄 মানি রিসিট PDF ডাউনলোড
      </text>
    </g>
  </g>
</svg>
