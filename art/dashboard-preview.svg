        <rect x="705" y="6" width="65" height="22" rx="6" fill="#0f172a"/>
        <text x="737" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">রিসিট 🖨️</text>
      </g>
      <line x1="20" y1="145" x2="780" y2="145" stroke="#f1f5f9"/>

      <!-- Row 2 -->
      <g transform="translate(0, 155)">
        <text x="30" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">UTR-2026-0001</text>
        <text x="160" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">নাফিসা কামাল</text>
        <text x="160" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">01819556677</text>
        <text x="350" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#334155">ডিজাইনার কামিজ (১টি)</text>
        <text x="470" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">৳১,৪৫০</text>
        <text x="470" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ef4444">বকেয়া: ৳৪৫০</text>
        <rect x="585" y="6" width="105" height="22" rx="11" fill="#fef9c3"/>
        <text x="637" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a16207">সেলাই চলছে</text>
        <rect x="705" y="6" width="65" height="22" rx="6" fill="#0f172a"/>
        <text x="737" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">রিসিট 🖨️</text>
      </g>
      <line x1="20" y1="195" x2="780" y2="195" stroke="#f1f5f9"/>

      <!-- Row 3 -->
      <g transform="translate(0, 205)">
        <text x="30" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">CTG-2026-0001</text>
        <text x="160" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">রফিকুল ইসলাম</text>
        <text x="160" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">01911889900</text>
        <text x="350" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#334155">ফরমাল প্যান্ট ও শার্ট</text>
        <text x="470" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">৳১,৮০০</text>
        <text x="470" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">পরিশোধিত ✓</text>
        <rect x="585" y="6" width="105" height="22" rx="11" fill="#e0e7ff"/>
        <text x="637" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4338ca">ডেলিভার্ড ✓</text>
        <rect x="705" y="6" width="65" height="22" rx="6" fill="#0f172a"/>
        <text x="737" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">রিসিট 🖨️</text>
