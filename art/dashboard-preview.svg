        <text x="160" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">01711223344</text>
        <text x="350" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#334155">পাঞ্জাবি, পায়জামা (২টি)</text>
        <text x="470" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">৳২,২৫০</text>
        <text x="470" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ef4444">বকেয়া: ৳৭৫০</text>
