<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Window Wrapper -->
  <rect width="1100" height="650" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Browser Header Bar -->
  <path d="M0 16 C0 7.16 7.16 0 16 0 L1084 0 C1092.84 0 1100 7.16 1100 16 L1100 44 L0 44 Z" fill="#0f172a"/>
  <circle cx="24" cy="22" r="5" fill="#ef4444"/>
  <circle cx="40" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="22" r="5" fill="#10b981"/>
  <rect x="280" y="10" width="540" height="24" rx="6" fill="#1e293b"/>
  <text x="550" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">https://darzipro.test/admin/dashboard • দর্জি প্রো ইআরপি</text>

  <!-- Sidebar -->
  <g transform="translate(0, 44)">
    <rect width="240" height="606" fill="url(#sideGrad)"/>
    
    <!-- Brand -->
    <text x="24" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">✂️ Darzi<tspan fill="#10b981">Pro</tspan></text>
    <text x="24" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">টেইলারিং ইআরপি v2.0</text>
    <line x1="20" y1="75" x2="220" y2="75" stroke="#1e293b"/>

    <!-- Nav Items -->
    <g transform="translate(16, 95)" font-family="system-ui, sans-serif" font-size="12">
      <!-- Active item -->
      <rect width="208" height="36" rx="8" fill="#064e3b" stroke="#059669"/>
      <text x="14" y="23" font-weight="700" fill="#a7f3d0">📊 ড্যাশবোর্ড ওভারভিউ</text>

      <text x="14" y="62" font-weight="600" fill="#94a3b8">✂️ টেইলারিং অর্ডার (All Orders)</text>
      <text x="14" y="98" font-weight="600" fill="#94a3b8">👥 গ্রাহক ও মাপ ভল্ট (Vault)</text>
      <text x="14" y="134" font-weight="600" fill="#94a3b8">⚡ কাউন্টার পিওএস (POS)</text>
      <text x="14" y="170" font-weight="600" fill="#94a3b8">🧵 কারিগর কাজ ও মজুরি</text>
      <text x="14" y="206" font-weight="600" fill="#94a3b8">📦 গজ কাপড় ও পণ্য স্টক</text>
      <text x="14" y="242" font-weight="600" fill="#94a3b8">⏱️ বায়োমেট্রিক হাজিরা (ZKTeco)</text>
      <text x="14" y="278" font-weight="600" fill="#94a3b8">💰 দোকান ব্যয় ও আয়-ব্যয়</text>
      <text x="14" y="314" font-weight="600" fill="#94a3b8">🎛️ মডিউল অন/অফ কন্ট্রোল</text>
      <text x="14" y="350" font-weight="600" fill="#94a3b8">🏢 শাখা সেটিংস (Branches)</text>
    </g>

    <!-- Branch selector badge in sidebar -->
    <g transform="translate(16, 540)">
      <rect width="208" height="50" rx="8" fill="#1e293b"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">সক্রিয় শাখা:</text>
