      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">আজকের নতুন অর্ডার</text>
      <text x="16" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#0f172a">২৪ টি</text>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#10b981">↑ ১২% গতকালের চেয়ে বেশি</text>

